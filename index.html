<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4A6FA5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CATS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">

    <!-- App Info -->
    <meta name="description" content="CATS - Culturally Adaptive Therapeutic System. Your AI-powered physiotherapist for personalized rehabilitation.">
    <meta name="keywords" content="physiotherapy, rehabilitation, AI, exercise, health">

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/Cats logo 1.png">
    <link rel="apple-touch-icon" href="/Cats logo 1.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <title>CATS - AI Physiotherapist</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
      /* Prevent pull-to-refresh on mobile */
      html, body {
        overscroll-behavior-y: contain;
      }

      /* Prevent text selection on UI elements */
      button, .no-select {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* Smooth touch scrolling */
      * {
        -webkit-tap-highlight-color: transparent;
      }

      /* Safe area padding */
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
</body>
</html>
